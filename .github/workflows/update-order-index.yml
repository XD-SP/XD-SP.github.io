name: 更新订单清单

on:
  push:
    paths:
      - 'orders/**'
      - 'scripts/gen-index.js'
      - '.github/workflows/update-order-index.yml'
    paths-ignore:
      - 'orders/index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 orders/index.json
        run: node scripts/gen-index.js

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orders/index.json
          if git diff --cached --quiet; then
            echo "清单无变化，跳过提交。"
          else
            git commit -m "chore: 更新订单清单"
            git push
          fi
